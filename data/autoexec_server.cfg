# General
sv_port 8303
sv_name "My DDNet server"
sv_map "blmapV3ROYAL"
sv_register 0
password ""
sv_max_clients 64
sv_max_clients_per_ip 1

# Rcon
sv_rcon_password "rcon"
sv_rcon_mod_password ""
sv_rcon_helper_password ""

sv_test_cmds 1

# Logging
# (-3 = None, -2 = Error, -1 = Warn, 0 = Info, 1 = Debug, 2 = Trace)
loglevel 0
logfile "autoexec_server.log"
stdout_output_level 0

# SQL
sv_use_sql 1
add_sqlserver r testdb record teeworlds "root" "localhost" "3306"
add_sqlserver w testdb record teeworlds "root" "localhost" "3306"

component_plug requests
component_plug chatfilter
component_plug events
add_vote "Start LMB event" "events_start lmb"
add_vote "Start LMB event" "events_start tdm"

# BW
sv_shop_server 0
sv_account_system 1
sv_1on1_system 1
sv_clan_min_level 25

sv_ddrace_rules 0
sv_rules_line1 "Cheating or using any kind of bot client is forbidden."
sv_rules_line2 "Account sharing is not allowed. "
sv_rules_line3 "DDoS threats or similar attacks will not be tolerated."
sv_rules_line4 "Do not share or expose anyone’s personal information. "
sv_rules_line5 "The use of macros or automation tools is prohibited."
sv_rules_line6 "Be respectful to others and follow admin instructions. "
sv_rules_line7 "Do not attempt to exploit or bypass the rules."
sv_rules_line8 "Do not fake or use names similar to other players. "
sv_rules_line9 "Using dummy or hammer-fly bots is not allowed."
sv_rules_line10 "Avoid trash-talking or disrespecting staff/community."

sv_motd "Welcome to Blockworlds! \n\nEnjoy your stay and have fun fighting against other players!\n\nRemember to follow the server rules and be respectful to other players. If you have any questions or need assistance, feel free to reach out to the admins or moderators. Happy gaming!\n\nAdmins:\n - Nouaa\n - Reitw\n - Brokecdx-\n - painn\n - Sakido\n - wHat\n - Insanity\n - 2pac\n - noby\n - potato\n\nModerators:\n - Meekrioz\n - Melon\n - Alexander"

access_level ban 1
access_level unban 1
access_level ban_range 1
access_level unban_range 1
access_level bans 1
access_level bans_save 1
access_level kick 1
access_level status_acc 1
access_level whois_name 1
access_level whois_ip 1
access_level logout 1
access_level mute 1
access_level muteid 1
access_level mutes 1
access_level unmute 1
access_level unmuteid 1

# Custom settings, better add them in separate file, autoexec gets overwritten on cmake reconfigure
exec myServer.cfg
