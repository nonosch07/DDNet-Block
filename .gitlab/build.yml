image: ubuntu:22.04

stages:
  - Build DDNet Server
  - Build docker image and deploy

build_cmake_release:
  stage: Build DDNet Server
  before_script:
    - apt-get update -y
    - apt-get upgrade -y
    - apt-get install
      pkg-config
      clang rustc
      cargo cmake ninja-build
      libmariadb-dev
      libcurl4-openssl-dev
      libssl-dev
      zlib1g-dev
      libsqlite3-dev
      sqlite3
      libpng-dev
      valgrind -y
  script:
    # Build Release
    - mkdir build && cd build
    - export CC=clang
    - export CXX=clang++
    - cmake -GNinja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCLIENT=OFF -DTOOLS=OFF -DDEV=ON -DMYSQL=ON -DANTIBOT=ON -DUPNP=OFF -DWEBSOCKETS=OFF -DVULKAN=OFF -DGFX=OFF ..
    - ninja game-server
    - cp DDNet-Server ../blockworlds
    - cp libantibot.so ../libantibot.so
    # Build Debug
    - rm -rf *
    - export CC=clang
    - export CXX=clang++
    - cmake -GNinja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCLIENT=OFF -DTOOLS=OFF -DDEV=ON -DMYSQL=ON -DANTIBOT=ON -DUPNP=OFF -DWEBSOCKETS=OFF -DVULKAN=OFF -DGFX=OFF ..
    - ninja game-server
    - cp DDNet-Server ../blockworlds_d
    

  artifacts:
    paths:
      - blockworlds
      - blockworlds_d
      - libantibot.so
    when: on_success
    expire_in: 7 days
  only:
    - master
    - test

package_main:
  stage: Build docker image and deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    IMAGE_LATEST: registry.gitlab.com/blockworlds1/blockworlds:latest
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"registry.gitlab.com\":{\"auth\":\"$(printf "%s:%s" "${GL_DEPLOY_USER}" "${GL_DEPLOY_PASS}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor 
      --context "${CI_PROJECT_DIR}" 
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile.blockworlds" 
      --destination "${IMAGE_LATEST}"
  only:
    - master


package_test:
  stage: Build docker image and deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    IMAGE_LATEST: registry.gitlab.com/blockworlds1/blockworlds:${CI_COMMIT_BRANCH}
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"registry.gitlab.com\":{\"auth\":\"$(printf "%s:%s" "${GL_DEPLOY_USER}" "${GL_DEPLOY_PASS}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor 
      --context "${CI_PROJECT_DIR}" 
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile.blockworlds" 
      --destination "${IMAGE_LATEST}"
  only:
    - test
