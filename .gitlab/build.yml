build_ddnet:
  stage: Build DDNet Server
  image: registry.gitlab.com/blockworlds1/blockworlds/buildtools:latest
  cache:
    key: "cache-$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/
      - .ccache/
      - build/_deps/
  script:
    # Build Release
    - mkdir build && cd build
    - export CC=clang
    - export CXX=clang++
    - cmake -GNinja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCLIENT=OFF -DTOOLS=OFF -DDEV=ON -DMYSQL=ON -DANTIBOT=ON -DUPNP=OFF -DWEBSOCKETS=OFF -DVULKAN=OFF -DGFX=OFF ..
    - ninja game-server
    - cp DDNet-Server ../blockworlds
    - cp libantibot.so ../libantibot.so

    # Build Debug
    - mkdir -p ../build_debug && cd ../build_debug
    - cmake -GNinja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCLIENT=OFF -DTOOLS=OFF -DDEV=ON -DMYSQL=ON -DANTIBOT=ON -DUPNP=OFF -DWEBSOCKETS=OFF -DVULKAN=OFF -DGFX=OFF ..
    - ninja game-server
    - cp DDNet-Server ../blockworlds_d
  artifacts:
    paths:
      - blockworlds
      - blockworlds_d
      - libantibot.so
    when: on_success
    expire_in: 7 days
  only:
    - master
    - test

package_main:
  stage: Build docker image and deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    IMAGE_LATEST: ${CI_REGISTRY_IMAGE}:latest
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"registry.gitlab.com\":{\"auth\":\"$(printf "%s:%s" "${GL_DEPLOY_USER}" "${GL_DEPLOY_PASS}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile.blockworlds"
      --destination "${IMAGE_LATEST}"
  only:
    - master


package_test:
  stage: Build docker image and deploy
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  variables:
    IMAGE_LATEST: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_BRANCH}
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"registry.gitlab.com\":{\"auth\":\"$(printf "%s:%s" "${GL_DEPLOY_USER}" "${GL_DEPLOY_PASS}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/Dockerfile.blockworlds"
      --destination "${IMAGE_LATEST}"
  only:
    - test
